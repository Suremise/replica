[workspace]
resolver = "3"
members = ["crates/replica-core", "crates/replica-win", "crates/replica"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Darren Marshall"]
repository = "https://github.com/Suremise/replica"
publish = false

[workspace.dependencies]
replica-core = { path = "crates/replica-core" }
replica-win = { path = "crates/replica-win" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
globset = "0.4.20"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
serde_json = "1.0.154"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
windows = "0.62.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow"] }
egui_kittest = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false }
rfd = { version = "0.17.2", default-features = false }
winit = { version = "0.30.13", default-features = false }
raw-window-handle = "0.6.2"
embed-resource = "3.0.12"
png = "0.18.1"

# Dev and test builds: line tables only for the workspace's crates, so panics and test
# failures still show file and line, and no debug info for the dependencies. A full test build's
# target\debug is less than half the size (docs/TESTING.md, Disk space). Release is unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
